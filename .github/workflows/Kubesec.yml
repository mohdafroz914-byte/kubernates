name: Kubesec Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kubesec:
    name: Scan Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Kubernetes manifests
        shell: bash
        run: |
          files=$(find ./kubernetes-manifests ./istio-manifests ./kustomize \
            -type f \( -name '*.yaml' -o -name '*.yml' \) -print 2>/dev/null)

          if [ -z "$files" ]; then
            echo "No Kubernetes YAML files found in the configured folders."
            exit 1
          fi

          while IFS= read -r file; do
            echo "Scanning $file"
            docker run --rm -i \
              -v "$PWD:/work" \
              kubesec/kubesec:v2 \
              scan "/work/${file#./}"
          done <<< "$files"
